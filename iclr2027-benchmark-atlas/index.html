<script id="article-data" type="application/json">[{"zh":"视觉隐喻生成","kind":"benchmark","area":"语义与创意","api":"高","source":"https://arxiv.org/abs/2609.02502","intro":"图画得漂亮，不代表它真正表达出了“把两个概念融为一个隐喻”。","what":"测文生图能否把两个不同语义域融合成可理解的视觉隐喻，而不是简单把两个物体并排画出来。","how":"VMetaphor-Bench 含 1,500 个视觉隐喻，分为三级、十类；每个案例有不同详略的提示词。用多模态模型对生成图像提问并评分。","metric":"9,594 道选择题检查域、结构、含义和元素映射；另从隐喻有效性、逻辑性、视觉和谐度三个维度给分。","finding":"强模型通常能呈现相关物体，却更容易在跨域元素映射和组合结构上失误。","idea":"很适合 API-only：固定 prompt → 多模型生成 → VLM 判定“真正融合”与“仅仅同时出现”，研究可验证的复杂语义遵循。","id":1,"title":"Blending Concepts: Benchmarking Visual Metaphor Generation in Text-to-Image Models","score":3.0,"ratings":"3; 3; 3","reviewCount":3,"url":"https://openreview.net/forum?id=qhfSTsw4FV","confidence":"verified","status":"未读"},{"zh":"多参考图分层生成","kind":"method","area":"参考图与编辑","api":"中","intro":"重点不是发布一个排行榜，而是研究如何把参考图拆成层级结构，再扩展参考图生成能力。","what":"研究 reference-to-image：输入一张或多张参考图，生成新画面时如何利用不同层次的视觉信息。","how":"从题目看，核心手段是 hierarchical image decomposition；需要正文确认分层定义、训练数据与具体生成流程。","metric":"尚未核实该文采用的评测集和数值指标；阅读时优先看身份保持、细节一致性、组合性以及参考图数量扩展。","finding":"公开摘要暂未核实；不能把该文当成纯 Benchmark。","idea":"如果只用 API，可以做“分解参考图 → 文字/图像多阶段生成”的推理期方案，但不等同于复现论文的方法。","id":2,"title":"RefTree: Scaling Reference-to-Image Generation via Hierarchical Image Decomposition","score":3.0,"ratings":"3; 3; 3","reviewCount":3,"url":"https://openreview.net/forum?id=kmfNwHyohD","confidence":"title","status":"未读"},{"zh":"图像模型能力极限","kind":"benchmark","area":"复杂指令","api":"高","source":"https://arxiv.org/abs/2610.26850","intro":"图像版“难题奥赛”：不问像不像，主要问复杂约束到底有没有满足。","what":"专门寻找前沿文生图模型的能力边界：计数、空间、物理、符号、文字、规则、世界知识、长程一致性等。","how":"GenOlympiad 用 9 条能力轴组织高难 prompt，约 801 道任务；把原始要求分解成简单/困难的可验证问题，必要时画辅助线辅助判断。","metric":"Strict：所有困难约束都过关才算成功；Relaxed：对部分约束成功给分。避免单纯靠主观美感排序。","finding":"论文报告最强文生图模型的 Strict 总分也只有约 23.9/100，说明复杂约束遵循远未饱和。","idea":"最接近 AIME 式刷榜入口：API 生成、多轮分解、程序校验/视觉问答、错误驱动 prompt 搜索，实施门槛低。","id":3,"title":"GenOlympiad: Benchmarking Frontier Image Models at Their Capability Boundaries","score":2.75,"ratings":"2; 2; 3; 4","reviewCount":4,"url":"https://openreview.net/forum?id=FpuhBZxZzo","confidence":"verified","status":"未读"},{"zh":"图像 Agent 完成真实委托","kind":"hybrid","area":"智能体工作流","api":"高","source":"https://arxiv.org/abs/2610.39330","intro":"不仅生成单张好图，还要完成一份包含多阶段、多交付物的真实视觉委托。","what":"测图像 Agent 能否消化混杂材料、保留跨步骤约束，并按要求交付完整且一致的视觉成果。","how":"Visual Commission Bench：600 项任务、12 类场景、3 个难度层级；为任务设置 5,039 个要求检查点，另看视觉品质。","metric":"严格任务成功率（所有必要要求都满足），还检查内容正确、视觉实现、约束保持和交付完整性。","finding":"作者的模块化 V-Protocol 在 VCB 上严格成功率 69%，对比基线 SCOPE 为 42%。","idea":"很适合 API-only 的 Agent Harness：拆分任务、调用生成/编辑 API、自动验收、失败重试，而不需要改底座。","id":4,"title":"Can Image Agents Complete Visual Commissions? A Benchmark and Modular Framework","score":2.67,"ratings":"2; 3; 3","reviewCount":3,"url":"https://openreview.net/forum?id=69eDEysdQF","confidence":"verified","status":"未读"},{"zh":"多轮生图的交互体验","kind":"benchmark","area":"智能体工作流","api":"高","intro":"一个多轮生成系统，不应该只看最后一张图，也要看用户整个修改过程是否顺畅。","what":"从题目看，IUX-GenBench 面向多轮图像生成中的交互式用户体验，如记住修改意图、保持未改区域、收敛到目标等。","how":"可以重点检查任务是否设置连续对话、逐轮编辑、用户反馈和中途变更需求；具体轮数与数据构成尚未核验。","metric":"需要阅读全文确认真实指标。建议关注每轮指令遵循、历史约束保持、修改成本、最终满意度是否分开计分。","finding":"仅据标题确认其关注“多轮交互体验”，尚无法负责任地陈述论文实验结论。","idea":"API-only 很适配：让 Agent 决策何时生成、何时编辑、何时澄清，比较交互轮次、成本和最终达标率。","id":5,"title":"IUX-GenBench: Benchmarking Interactive User Experience for Multi-Turn Image Generation","score":2.67,"ratings":"2; 3; 3","reviewCount":3,"url":"https://openreview.net/forum?id=IRSjL2IEF3","confidence":"title","status":"未读"},{"zh":"Agentic 生图的知识边界","kind":"hybrid","area":"智能体工作流","api":"高","source":"https://arxiv.org/abs/2607.05382","confidence":"related","intro":"生成器不知道的新人物、新事件和长尾知识，往往被它“画得很自信但很错误”。","what":"关注 Agentic Visual Generation 的能力边界，尤其知识缺口能否通过搜索与外部参考补全。","how":"检索到主题高度相关的公开版本 SearchGen：其数据包含 20,839 条世界知识提示词、12 类失败、22 个领域，并强调区分“需要搜索/无需搜索”的输入。该版本标题与 CSV 不完全相同。","metric":"相关版本采用知识事实、提示遵循和视觉质量等维度检查；正式指标应以 CSV 中对应 OpenReview 版本为准。","finding":"相关公开版本指出盲目搜索会污染本来就能画对的图，因此需识别模型特有的知识边界。","idea":"特别适合 API-only 的检索增强生成：基准重现、Search/No-search 门控、检索参考筛选、失败自动诊断。","id":6,"title":"Benchmarking and Evolving the Capability Boundary in Agentic Visual Generation","score":2.67,"ratings":"2; 3; 3","reviewCount":3,"url":"https://openreview.net/forum?id=bA6HOzShFe","status":"未读"},{"zh":"扩散模型的空间逻辑","kind":"hybrid","area":"空间与世界模型","api":"中","source":"https://arxiv.org/abs/2610.09780","intro":"会画图片 ≠ 理解空间约束；像人解拼图一样“按规则画”更难。","what":"测生成模型能否满足隐藏在视觉谜题中的空间关系和逻辑约束，而非只拟合像素外观。","how":"作者构建了 4 组基于人类可解谜题的大规模生成式空间推理数据，并提出对象关系抽象来辅助扩散模型。","metric":"重点看生成结果是否满足谜题/空间关系规则，以及面对分布外关系组合时的泛化。","finding":"引入对象中心表示和关系抽象后，模型在复杂逻辑任务以及 OOD 条件下更可靠。","idea":"Benchmark 可用 API 跑，但论文方法依赖模型内部训练/引导；可尝试规则求解器先规划、再用图像 API 实现。","id":7,"title":"Relational Abstractions for Spatial Reasoning with Diffusion Models","score":2.67,"ratings":"2; 3; 3","reviewCount":3,"url":"https://openreview.net/forum?id=eHpgsTtmzX","confidence":"verified","status":"未读"},{"zh":"AI 伪造退款凭证检测","kind":"benchmark","area":"安全与取证","api":"高","source":"https://arxiv.org/abs/2605.08820","intro":"识别“这张图是不是假的”不够，还得判断它是否虚构了具体的损坏事实。","what":"测多模态模型和取证检测器能否识别 AI 生成的售后退款欺诈证据，同时不误伤真实的损坏照片。","how":"FraudBench 基于电商、餐饮配送、旅游服务等真实评论；有 822 条评论、7,928 张图，伪造样本使用多种生图/编辑模型合成。","metric":"假损坏识别率 TPR、真实损坏保留率 TNR、Balanced Accuracy；还比较是否给出评论上下文、单图/多图等设置。","finding":"通用多模态模型对伪造损坏证据的识别并不稳定，专用检测器也容易跨生成器失效或误报。","idea":"偏安全/检测，不是生成能力主线；但“结合声明事实做视觉核查”值得迁移到图像 Agent 的可验证评测。","id":8,"title":"FraudBench: A Multimodal Benchmark for Detecting AI-Generated Fraudulent Refund Evidence","score":2.67,"ratings":"2; 3; 3","reviewCount":3,"url":"https://openreview.net/forum?id=WtGCxYPpvD","confidence":"verified","status":"未读"},{"zh":"多参考图长上下文生成","kind":"hybrid","area":"参考图与编辑","api":"高","source":"https://arxiv.org/abs/2603.25319","intro":"参考图越多，生成器越容易忘记谁是谁、哪个细节应从哪张图来。","what":"测模型在 1–10 张参考图条件下的内容整合、人物/物体一致性与跨图关系。","how":"MacroData 约 40 万训练样本；MacroBench 4,000 条，覆盖定制、插画、空间视角、时间预测四类任务 × 四档参考图数量。","metric":"按任务类别和参考图数量分组评估生成质量与条件一致性，重点观察随上下文长度增加的性能退化。","finding":"结构化多参考数据的训练可改善模型整合大量参考图的能力，空间类挑战仍明显。","idea":"API-only 可以做“参考图数 fidence":"snippet","status":"未读"},{"zh":"多概念共现时的安全引导","kind":"method","area":"安全与取证","api":"低","intro":"当多个敏感概念同时出现，分别施加安全约束可能彼此冲突。","what":"研究多个共现概念的安全引导如何联合优化，而非只对单一目标做抑制。","how":"题目表明使用二次规划汇总 Safety Guidance；OpenReview 索引提到 CHC-Bench，具体优化目标待正文核验。","metric":"应看多目标抑制是否成功、正常内容保真度、共现目标数量增加时的稳定性。","finding":"目前能确认存在 CHC-Bench 评测，具体提升数字未核实。","idea":"主要涉及采样过程的内部 guidance，纯生图 API 难复现；可转成外部重写/过滤约束。","id":41,"title":"Aggregating Safety Guidance for Co-occurring Concepts via Quadratic Programming","score":2.33,"ratings":"2; 2; 3","reviewCount":3,"url":"https://openreview.net/forum?id=o9aYcHbl78","confidence":"snippet","status":"未读"},{"zh":"医学图像取证与临床推理","kind":"hybrid","area":"安全与取证","api":"中","intro":"医学图像真假判断不仅要看篡改痕迹，还要解释其与医学证据是否一致。","what":"BEAR-Med 从题目看，结合临床真实性的 Benchmark 与专家对齐推理，评估医学图像取证能力。","how":"需核对影像类型、伪造/篡改方式、临床标注者与解释输出协议；目前未获取可靠公开摘要。","metric":"应区分真伪/篡改定位、证据解释正确性和临床合理性，另注意医学专业评估误差。","finding":"不能编造相关模型成绩或医疗适用性结论。","idea":"更适合医学多模态/安全团队，需领域专家与数据许可；不宜作为普通生图 API 的第一条研究线。","id":42,"title":"BEAR-Med: From a Clinically Grounded Benchmark to Expert-Aligned Reasoning in Medical Image Forensics","score":2.33,"ratings":"2; 2; 3","reviewCount":3,"url":"https://openreview.net/forum?id=OtrOIMLig8","confidence":"title","status":"未读"}]</script>
<script>
(()=>{'use strict';
const articles=JSON.parse(document.getElementById('article-data').textContent);
const BYID=new Map(articles.map(a=>[a.id,a]));
const icons={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="m15 18-6-6 6-6"/>',book:'<path d="M3 5.5a2 2 0 0 1 2-2h6v17H5a2 2 0 0 0-2 2zm8-2h6a2 2 0 0 1 2 2v17a2 2 0 0 0-2-2h-6"/>',star:'<path d="m12 3 2.8 5.8 6.5.9-4.7 4.5 1.1 6.4-5.7-3-5.7 3 1.1-6.4-4.7-4.5 6.5-.9z"/>',check:'<path d="m5 12 4 4L19 6"/>',external:'<path d="M13 5h6v6M19 5l-9 9"/><path d="M19 13v6H5V5h6"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',pen:'<path d="M12 20h9M16.5 3.5l4 4L7 21H3v-4z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>'};
function svg(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.arrow}</svg>`}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
const typeNames={benchmark:'评测基准',hybrid:'基准 + 方法',dataset:'数据集',method:'方法研究'};
const apiNames={高:'API 友好',中:'部分 API 可做',低:'更依赖训练'};
const filters=[['all','全部'],['benchmark','Benchmark'],['hybrid','基准 + 方法'],['dataset','数据集'],['method','方法研究'],['saved','已收藏'],['unread','未读']];
let state={view:'home',id:1,filter:'all',q:'',menu:false};
const key='iclr27_benchmark_atlas_v2';
let stored={read:[],saved:[],notes:{}};
try {let s=JSON.parse(localStorage.getItem(key)||'{}');stored={read:Array.isArray(s.read)?s.read:[],saved:Array.isArray(s.saved)?s.saved:[],notes:s.notes&&typeof s.notes==='object'?s.notes:{}}}catch(e){}
let read=new Set(stored.read), saved=new Set(stored.saved),notes=stored.notes;
const save=()=>{try{localStorage.setItem(key,JSON.stringify({read:[...read],saved:[...saved],notes}))}catch(e){}};
let toastTimer=0;
function toast(s){let t=document.querySelector('.toast');if(!t)return;t.textContent=s;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2200)}
function current(){return BYID.get(state.id)||articles[0]}
function filtered(){let q=state.q.trim().toLowerCase();return articles.filter(a=>(!q||[a.title,a.zh,a.intro,a.what,a.area,a.metric].some(x=>String(x).toLowerCase().includes(q)))&&(state.filter==='all'||(state.filter==='saved'?saved.has(a.id):state.filter==='unread'?!read.has(a.id):a.kind===state.filter)))}
function side(){return `<aside class="sidebar ${state.menu?'isOpen':''}" aria-label="论文目录"><div class="sideHeader"><div class="brand"><div class="brandMark">b.</div> BENCHMARK ATLAS <small>ICLR '27</small></div><h2 class="sideHeadTitle">Read the <em>frontier.</em></h2><div class="sideDesc">42 篇视觉生成论文 · 中文速读 · 离线进度</div><div class="progressTrack"><div class="progressFill" style="width:${read.size/42*100}%"></div></div><div class="progressLabel"><span>阅读进度</span><strong>${read.size} / 42 <span style="color:#9a9f9a;font-weight:500">(${Math.round(read.size/42*100)}%)</span></strong></div><div class="searchWrap">${svg('search',17)}<input id="search" type="search" autocomplete="off" value="${esc(state.q)}" placeholder="搜论文、能力或主题..." aria-label="搜索论文"></div><div class="pills">${filters.map(f=>`<button class="pill ${state.filter===f[0]?'active':''}" data-filter="${f[0]}">${f[1]}</button>`).join('')}</div></div><div class="listMeta"><span id="countLabel">显示 ${filtered().length} / 42 篇</span><button data-go="home">回到首页</button></div><div class="paperList" id="paperList">${list()}</div></aside>`}
function list(){let arr=filtered();return arr.length?arr.map(a=>`<button class="paperRow ${state.view==='detail'&&state.id===a.id?'selected':''}" data-paper="${a.id}" aria-label="打开第${a.id}篇 ${esc(a.zh)}"><div class="paperIndex">${String(a.id).padStart(2,'0')}</div><div class="paperRowMiddle"><span class="paperRowTitle">${esc(a.zh)}</span><div class="paperRowInfo"><span>${esc(typeNames[a.kind])}</span><span class="tinyScore">★ ${a.score.toFixed(2)}</span></div></div><div class="paperRowRight"><i class="readDot ${read.has(a.id)?'done':''}"></i>${saved.has(a.id)?'<span class="bookmarkDot">★</span>':''}</div></button>`).join(''):`<div class="emptyState"><strong>没有匹配的论文</strong>换一个关键词或筛选条件试试</div>`}
function header(){return `<div class="topbar"><div class="topmark"><i></i> VISUAL GENERATION / 2027</div><div class="topright"><button class="topLink mobileMenu" data-menu="open" aria-label="打开目录">${svg('menu',16)} 目录</button><button class="topLink desktop" data-go="home">${svg('grid')} 全部论文</button><button class="topLink" data-copy="${state.view==='detail'?'paper':'progress'}">${svg('copy',15)} ${state.view==='detail'?'复制摘要':'备份进度'}</button></div></div>`}
function home(){let listIds=[3,4,25,9,37,24];let completed=read.size;let continueId=articles.find(a=>!read.has(a.id))?.id||1;let kinds=articles.filter(a=>a.kind==='benchmark').length;return `<section class="hero"><div class="eyebrow">PAPERS, NOT HYPE.</div><h1>One paper.<br><span class="serif">One insight.</span></h1><p>将 ICLR 2027 的视觉生成研究拆成 42 张研究卡片。每篇只讲最重要的：到底测什么、如何评价、主要发现，以及用 API 能从哪里切入。</p><div class="heroActions"><button class="cta" data-paper="${continueId}">${completed?'继续阅读':'从第一篇开始'} ${svg('arrow',18)}</button><button class="secondaryCta" data-menu="open">${svg('filter',16)} 浏览全部 42 篇</button></div></section><section class="statGrid"><div class="stat"><strong>42</strong><small>评分 ≥ 2.33</small></div><div class="stat"><strong>${kinds}</strong><small>主要是 Benchmark</small></div><div class="stat"><strong>${completed}<span style="font-size:22px;color:#abaeaa">/42</span></strong><small>已读进度</small></div></section><div class="sectionHeader"><div class="sectionTitle">建议优先看</div><div class="sectionSub">API / Agent / 世界模型</div></div><section class="featureGrid">${listIds.map(id=>{let a=BYID.get(id);return `<button class="feature" data-paper="${id}"><div style="display:flex;align-items:center"><span class="fNo">${String(id).padStart(2,'0')} / 42</span><span class="fTag">${esc(a.area)}</span></div><h3>${esc(a.zh)}</h3><p>${esc(a.intro)}</p><div class="featureBottom"><span>${esc(apiNames[a.api])} · ${a.score.toFixed(2)} 分</span><span class="arrow">↗</span></div></button>`}).join('')}</section><div class="hint"><strong>说明：</strong>评分来自上传 CSV 的 OpenReview 平均分，不是录用结果或绝对论文质量。已检索到公开摘要的论文会显示「摘要核对」；公开资料不足的条目将显示「索引片段」或「标题推断」，不虚构样本数和论文结论。点击左上「目录」可按分类或关键词逐篇查阅。<br>本页为独立 HTML，阅读状态、收藏和笔记仅保存在当前浏览器本地；不会上传到服务器。</div>`}
const section=(num,heading,body,last=false)=>`<section class="readingSection ${last?'last':''}"><div class="sectionLine"><span class="sectionNo">${num}</span><h3>${heading}</h3></div><p>${esc(body)}</p></section>`;
function detail(){let a=current(),i=a.id,finish=read.has(i),fav=saved.has(i);let confidenceLabel=a.confidence==='verified'?'摘要核对':a.confidence==='related'?'相关版本参考':a.confidence==='snippet'?'索引片段':'标题推断',confidenceHint=a.confidence==='verified'?'本文核心信息根据已检索的公开摘要/项目页整理。':a.confidence==='related'?'找到主题相关的公开预印本，但其标题与 CSV 不完全一致；请以 OpenReview 版本为准。':a.confidence==='snippet'?'只检索到 OpenReview 的搜索摘要片段，无法全面核对实验数据；具体指标仍待阅读全文确认。':'未获取足够可靠的公开摘要；只提供保守的选题解读，不将推测写成实证发现。';let sourceButton=a.source?`<a class="sourceButton" target="_blank" rel="noopener noreferrer" href="${esc(a.source)}">${svg('external')} ${a.confidence==='related'?'相关预印本':'arXiv / 项目'}</a>`:'';
return `<article class="reader"><div class="crumb"><button data-go="home">首页</button><span>›</span><span>论文 ${String(i).padStart(2,'0')} / 42</span></div><div class="readerHead"><div class="readerNum">ARTICLE ${String(i).padStart(2,'0')} / 42</div><h1 class="readerTitle">${esc(a.zh)}</h1><p class="originalTitle">${esc(a.title)}</p><div class="tagRow"><span class="tag score">★ ${a.score.toFixed(2)}</span><span class="tag">${esc(typeNames[a.kind])}</span><span class="tag">${esc(a.area)}</span><span class="tag api">${esc(apiNames[a.api])}</span><span class="tag ${a.confidence!=='verified'?'warn':''}">${confidenceLabel}</span></div></div><div class="leadCard"><div class="leadEyebrow">THE BIG IDEA · 一句话看懂</div><p>${esc(a.intro)}</p></div>${section('01','它想测什么？',a.what)}${section('02','任务与数据怎么设计？',a.how)}${section('03','怎么算分、怎么评？',a.metric)}${section('04','论文结论 / 关键价值',a.finding,true)}<div class="ideaBox"><div class="ideaTop">${svg('arrow',16)} 研究切入点 · API-ONLY 视角</div><p>${esc(a.idea)}</p></div><div class="infoNote"><b>阅读可信度：${confidenceLabel}</b>　${esc(confidenceHint)}</div><div class="sourceBlock"><span>${a.reviewCount} 份评分 · ${esc(a.ratings)} · 来源链接</span><a class="sourceButton" target="_blank" rel="noopener noreferrer" href="${esc(a.url)}">${svg('external')} OpenReview 原文</a>${sourceButton}</div><div class="noteBox"><div class="noteHead"><label for="myNote">我的阅读笔记</label><small>自动保存到本机</small></div><textarea id="myNote" placeholder="值得追的 Benchmark、方法想法、要查的细节……">${esc(notes[i]||'')}</textarea></div><div class="bottomControls"><button class="action" data-prev="1" ${i===1?'disabled':''}>${svg('back',15)} 上一篇</button><button class="action mainAction" data-read="${i}">${svg('check',16)} ${finish?'已读 · 取消标记':'标记已读'}</button><button class="action fav ${fav?'active':''}" data-save="${i}" title="收藏">${fav?'★':'☆'}</button></div>${i<articles.length?`<button class="nextHero" data-paper="${i+1}"><div><span>UP NEXT · 下一篇</span><strong>${esc(articles[i].zh)}</strong></div><b>→</b></button>`:`<button class="nextHero" data-go="home"><div><span>FINISHED · 全部阅读完毕</span><strong>返回论文目录</strong></div><b>↗</b></button>`}</article>`}
function mobile(){return `<div class="mobileBar"><button data-go="home" class="${state.view==='home'?'active':''}">${svg('grid')} 首页</button><button data-menu="open">${svg('book')} 全部论文</button><div class="progressPill">${read.size}/42 已读</div><button data-filter-go="saved">${svg('star')} 收藏</button><button data-paper="${articles.find(a=>!read.has(a.id))?.id||1}">${svg('clock')} 继续</button></div>`}
function render(preserveScroll=false){const scroll=window.scrollY;document.getElementById('app').innerHTML=`<div class="shell">${side()}<main class="main">${header()}${state.view==='home'?home():detail()}</main></div><div class="overlay ${state.menu?'isOpen':''}" data-menu="close"></div>${mobile()}<div class="toast" role="status" aria-live="polite"></div>`;bind();if(preserveScroll)window.scrollTo(0,scroll);else window.scrollTo({top:0,behavior:'instant'});}
function updateList(){let node=document.getElementById('paperList');if(node)node.innerHTML=list();let n=document.getElementById('countLabel');if(n)n.textContent=`显示 ${filtered().length} / 42 篇`;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));}
function go(id){state.id=Number(id)||1;state.view='detail';state.menu=false;history.replaceState(null,'',`#paper-${state.id}`);render();}
function goHome(){state.view='home';state.menu=false;history.replaceState(null,'',location.pathname+location.search);render()}
function bind(){document.querySelectorAll('[data-paper]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.paper)));
document.querySelectorAll('[data-go="home"]').forEach(el=>el.addEventListener('click',goHome));
document.querySelectorAll('[data-menu]').forEach(el=>el.addEventListener('click',()=>{state.menu=el.dataset.menu==='open';render(true)}));
document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.filter;updateList()}));
let srch=document.getElementById('search');if(srch)srch.addEventListener('input',e=>{state.q=e.target.value;updateList()});
document.querySelectorAll('[data-filter-go]').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.filterGo;state.menu=true;render(true)}));
document.querySelectorAll('[data-prev]').forEach(el=>el.addEventListener('click',()=>{if(state.id>1)go(state.id-1)}));
document.querySelectorAll('[data-read]').forEach(el=>el.addEventListener('click',()=>{let id=+el.dataset.read;if(read.has(id))read.delete(id);else read.add(id);save();render(true);toast(read.has(id)?'已标记读完 ✓':'已取消已读标记')}));
document.querySelectorAll('[data-save]').forEach(el=>el.addEventListener('click',()=>{let id=+el.dataset.save;if(saved.has(id))saved.delete(id);else saved.add(id);save();render(true);toast(saved.has(id)?'已加入收藏':'已取消收藏')}));
let note=document.getElementById('myNote');if(note)note.addEventListener('input',e=>{notes[state.id]=e.target.value;save()});
document.querySelectorAll('[data-copy]').forEach(el=>el.addEventListener('click',()=>{let s=el.dataset.copy==='paper'?`${current().zh}\n${current().title}\n${current().url}\n\n测什么：${current().what}\n怎么测：${current().how}\n指标：${current().metric}\n结论：${current().finding}\n切入点：${current().idea}`:JSON.stringify({read:[...read],saved:[...saved],notes},null,2);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast('已复制到剪贴板')).catch(()=>fallbackCopy(s));else fallbackCopy(s)}));}
function fallbackCopy(s){let ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制到剪贴板')}catch(e){toast('无法复制，请使用浏览器分享')}ta.remove()}
function loadHash(){let m=location.hash.match(/^#paper-(\d+)$/);if(m&&BYID.has(+m[1])){state.view='detail';state.id=+m[1];}}
window.addEventListener('hashchange',()=>{loadHash();render()});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowRight'&&state.view==='detail'&&state.id<42)go(state.id+1);if(e.key==='ArrowLeft'&&state.view==='detail'&&state.id>1)go(state.id-1);if(e.key==='Escape'&&state.menu){state.menu=false;render(true)}});
let touch=null;document.addEventListener('touchstart',e=>{if(state.view==='detail'&&!state.menu&&e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now()}},{passive:true});document.addEventListener('touchend',e=>{if(!touch||state.view!=='detail'||e.changedTouches.length!==1)return;let dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>110&&Math.abs(dx)>Math.abs(dy)*2&&Math.abs(dy)<85){if(dx<0&&state.id<42)go(state.id+1);if(dx>0&&state.id>1)go(state.id-1)}},{passive:true});
loadHash();render();
})();
</script>
</body>
</html>

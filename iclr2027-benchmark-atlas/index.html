const evidenceText=p=>p.evidence==='paper'?'依据所链接的公开论文与图表整理，中文内容为编者概括。任务例子为自拟讲解，原图保留作者内容和来源。':p.evidence==='related'?'本页参考 SearchGen 的相关公开版本，标题与 CSV 中的投稿标题不同；数据、发现与配图均归属于这里链接的公开版本。对应投稿请查看 OpenReview。':p.evidence==='snippet'?'依据论文标题与公开检索片段做选题解读。例子、评测关注点与研究建议是编者说明；本页未收录未经核实的实验成绩。':'本页为基于论文标题的选题解读。研究动机、任务例子和阅读问题用于理解选题；论文的具体构建流程、指标与实验结论仍需原文核对。';
const stats={figures:papers.reduce((s,p)=>s+p.figures.length,0),illustrated:papers.filter(p=>p.figures.length).length};
const save=()=>{try{localStorage.setItem(key,JSON.stringify({read:[...read],saved:[...saved],notes}))}catch(e){toast('浏览器未允许保存进度，可使用备份功能。')}};
const progress=()=>`${read.size} / 42 已读`;
let toastTimer;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function filtered(){let q=state.q.trim().toLowerCase();return papers.filter(p=>(!q||[p.zh,p.title,p.one,p.gap,p.idea].some(t=>String(t).toLowerCase().includes(q)))&&(state.filter==='all'||state.filter==='figures'&&p.figures.length||state.filter==='saved'&&saved.has(p.id)||state.filter==='unread'&&!read.has(p.id)||p.kind===state.filter));}
function listHTML(){const arr=filtered();return arr.length?arr.map(p=>`<button class="paperRow ${state.id===p.id?'selected':''}" data-paper="${p.id}"><span class="num">${String(p.id).padStart(2,'0')}</span><span><span class="rowName">${esc(p.zh)}</span><span class="rowInfo"><span>★ ${p.score.toFixed(2)}</span><span>${types[p.kind]}</span>${p.figures.length?'<span class="photoTag">▧ 原图</span>':''}${saved.has(p.id)?'<span>★ 收藏</span>':''}</span></span><i class="doneDot ${read.has(p.id)?'yes':''}"></i></button>`).join(''):'<div class="empty">没有匹配的论文。试试其他关键词或筛选条件。</div>';}
function sidebar(){return `<aside class="sidebar" id="sidebar" aria-label="论文目录"><button class="closeSide" data-action="close-menu" aria-label="关闭目录">✕</button><a class="brand" href="#home"><span class="brandMark">b.</span><span>Benchmark Atlas<small>ICLR 2027 · 图文导读</small></span></a><div class="sideIntro">一篇一篇，读懂评测。<span>42 篇 · 评分 ≥ 2.33 · 保留原始顺序</span></div><div class="search">${icon('search',16)}<input id="search" type="search" placeholder="搜论文、能力或问题…" aria-label="搜索论文" value="${esc(state.q)}"></div><div class="filters">${filterDefs.map(([k,v])=>`<button class="chip ${state.filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')}</div><div class="listMeta"><span id="listCount">${filtered().length} / 42 篇</span><button class="textBtn" data-action="home">回到首页</button></div><nav class="paperList" id="paperList">${listHTML()}</nav><div class="sideFoot"><div class="progressLine"><span>本地阅读进度</span><b data-progress>${progress()}</b></div><div class="track"><i id="progressFill" style="width:${read.size/42*100}%"></i></div><div class="sideActions"><button data-action="export">备份进度</button><button data-action="import">导入备份</button></div></div></aside>`;}
function topbar(){return `<header class="topbar"><span><span class="siteName">BENCHMARK ATLAS</span><br><span class="edition">ILLUSTRATED EDITION · 2026.11</span></span><div class="topActions"><button class="desktopHome" data-action="home">首页</button><button data-action="copy">${icon('external',15)} ${state.id?'分享本篇':'分享网页'}</button><button class="mobileMenu" data-action="menu">${icon('menu',17)} 目录</button></div></header>`;}
function home(){const continueId=byId.has(lastId)?lastId:1;return `<section class="hero"><div class="eyebrow">THE QUESTION BEHIND THE BENCHMARK</div><h1>看图，<span>读懂一篇。</span></h1><p>先弄清为什么需要这项评测，再用任务例子、原论文配图和关键发现，把研究问题讲明白。</p><div class="heroActions"><button class="primary" data-paper="${continueId}">${read.size||lastId>1?'继续阅读':'从第一篇开始'} ${icon('arrow')}</button><button class="secondary" data-filter-open="figures">${icon('image')} 先看有原图的论文</button></div></section><section class="stats"><div class="stat"><strong>42</strong><span>篇中文导读</span></div><div class="stat"><strong>${stats.figures}</strong><span>张公开论文配图</span></div><div class="stat"><strong>${stats.illustrated}</strong><span>篇已有原图</span></div></section><div class="sectionHead"><h2>从这些问题开始</h2><span>点开一篇 · 图可放大</span></div><section class="featureGrid">${[1,3,4,24,25,33].map(id=>{const p=byId.get(id),f=p.figures[0];return `<button class="feature" data-paper="${id}"><div class="thumb"><img src="${esc(f.src)}" alt="${esc(f.title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div><div class="featureBody"><div class="featureTop"><span>ARTICLE ${String(id).padStart(2,'0')}</span><span>${p.figures.length} 张原图 · ${p.score.toFixed(2)}</span></div><h3>${esc(p.zh)}</h3><p>${esc(p.one)}</p><div class="featureBottom">开始阅读 ${icon('arrow',14)}</div></div></button>`}).join('')}</section><section class="guide"><h3>每篇沿着同一条线读</h3><p>找到旧评测遗漏的能力，看作者怎样把它变成可评分任务，再看实验揭示了什么。配图下附有阅读提示，帮助定位图里最重要的信息。</p><div class="route">评测缺口 → 任务例子 → 构建与评分 → 关键发现 → 研究切入点</div></section><p class="homeNote">评分沿用上传 CSV，包含 2.33 分的条目。原图取自所链接的公开论文；第 6 篇使用相关公开版本并单独标注。所有“讲解例子”均为自拟。题目解读条目保留选题分析与阅读问题，来源说明可在每篇末尾展开。进度、收藏与笔记保存在当前浏览器。</p>`;}
function section(n,title,text){return `<section class="readingSection"><div class="sectionLabel"><span class="number">${n}</span><h2>${title}</h2></div><p>${esc(text)}</p></section>`;}
function figure(p,i){const f=p.figures[i];if(!f)return '';return `<figure class="figure"><div class="figureTop"><b>${f.related?'相关版本原图':'论文原图'} ${i+1} / ${p.figures.length}</b><span>点图放大 · 可查看完整原图</span></div><button class="figureOpen" data-zoom="${p.id}:${i}" aria-label="放大：${esc(f.title)}"><img src="${esc(f.src)}" alt="${esc(f.title)}" loading="${i===0?'eager':'lazy'}" decoding="async" referrerpolicy="no-referrer"><span class="imageStatus">正在读取原论文配图…</span></button><figcaption class="figCaption"><h3>${esc(f.title)}</h3><p><b>看图提示：</b>${esc(f.caption)}</p><div class="figLinks"><a href="${esc(f.source)}" target="_blank" rel="noopener noreferrer">来源：作者公开论文 ↗</a><a href="${esc(f.src)}" target="_blank" rel="noopener noreferrer">打开原图 ↗</a><button data-retry="${p.id}:${i}">重新加载</button></div></figcaption></figure>`;}
function example(p){return `<section class="example" aria-label="讲解用任务流程"><div class="exampleHead"><h2>用一个任务理解</h2><span>讲解例子 · 自拟</span></div><div class="steps">${p.example.map((t,i)=>`<div class="step"><b>${['输入','输出','检查'][i]}</b><p>${esc(t)}</p></div>`).join('')}</div></section>`;}
function detail(p){const factual=p.evidence==='paper'||p.evidence==='related';return `<article class="reader"><div class="crumb"><button data-action="home">首页</button><span>／</span><span>论文 ${String(p.id).padStart(2,'0')} / 42</span></div><div class="readerMeta">ARTICLE ${String(p.id).padStart(2,'0')} · ${types[p.kind]}</div><h1 class="readerTitle">${esc(p.zh)}</h1><p class="english">${esc(p.title)}</p><div class="tags"><span class="tag score">★ ${p.score.toFixed(2)}</span><span class="tag">${evidenceNames[p.evidence]}</span>${p.figures.length?`<span class="tag green">${p.figures.length} 张${p.evidence==='related'?'相关版本':''}原图</span>`:''}<span class="tag">${p.api==='高'?'API 友好':p.api==='中'?'部分环节可用 API':'主要依赖训练'}</span></div><div class="lead">${esc(p.one)}</div>${section('01',p.kind==='benchmark'||p.kind==='hybrid'?'为什么需要这项评测？':'这项研究解决什么缺口？',p.gap)}${figure(p,0)}${example(p)}${factual?section('02',p.kind==='dataset'?'数据怎样组织？':'任务与数据怎样构建？',p.build)+figure(p,1)+section('03','怎样评分？',p.metrics)+`<section class="finding"><strong>${p.evidence==='related'?'相关公开版本的发现':'实验揭示了什么'}</strong><p>${esc(p.finding)}</p></section>`:`<section class="readingSection"><div class="sectionLabel"><span class="number">02</span><h2>读原文时抓住这两点</h2></div><div class="questions">${p.questions.map((q,i)=>`<p><b>Q${i+1}.</b> ${esc(q)}</p>`).join('')}</div></section>`}<section class="idea"><h2>${icon('arrow',17)} 研究切入点 · 编者建议</h2><p>${esc(p.idea)}</p></section><details class="sourceDetails"><summary>来源与版本说明 · ${evidenceNames[p.evidence]}</summary><p>${evidenceText(p)} 评分来自上传 CSV。图下注解为阅读提示，图片版权归原作者；配图需要联网加载。</p><div class="sourceLinks"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">OpenReview ${icon('external',12)}</a>${p.source?`<a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">${p.evidence==='related'?'相关版本':'论文'} HTML ${icon('external',12)}</a><a href="https://arxiv.org/pdf/${esc(p.arxiv)}" target="_blank" rel="noopener noreferrer">PDF ${icon('external',12)}</a>`:''}</div></details><div class="readerActions"><button class="primary" data-action="read" data-read-button>${icon('check')} ${read.has(p.id)?'已读完 · 取消标记':'标记读完'}</button><button class="secondary" data-action="save" data-save-button>${icon('star')} ${saved.has(p.id)?'已收藏':'收藏本篇'}</button></div><div class="note"><label for="myNote">我的想法 · 自动保存在此浏览器</label><textarea id="myNote" placeholder="记下一个启发、疑问，或想尝试的实验…">${esc(notes[p.id]||'')}</textarea></div><div class="endNav"><button data-paper="${p.id-1}" ${p.id===1?'disabled':''}><small>← 上一篇</small><b>${p.id>1?esc(byId.get(p.id-1).zh):'已到第一篇'}</b></button><button data-paper="${p.id+1}" ${p.id===42?'disabled':''}><small>下一篇 →</small><b>${p.id<42?esc(byId.get(p.id+1).zh):'已到最后一篇'}</b></button></div></article>`;}
function mobileBar(){return `<nav class="mobileBar" aria-label="阅读翻篇">${state.id?`<button data-paper="${state.id-1}" ${state.id===1?'disabled':''}>${icon('back',15)} 上一篇</button><button class="bookmark" data-action="save" aria-label="收藏本篇">${icon('star',18)}</button><button class="forward" data-paper="${state.id+1}" ${state.id===42?'disabled':''}>下一篇 ${icon('arrow',15)}</button>`:`<button data-action="menu">${icon('book',16)} 全部论文</button><button class="forward" data-paper="${byId.has(lastId)?lastId:1}">开始 / 继续阅读 ${icon('arrow',16)}</button>`}</nav>`;}
function render(){document.title=state.id?byId.get(state.id).zh+' · Benchmark Atlas':'Benchmark Atlas · 论文图文导读';document.getElementById('app').innerHTML=`<div class="app">${sidebar()}<main class="main">${topbar()}${state.id?detail(byId.get(state.id)):home()}</main></div>${mobileBar()}`;setMenu(false);window.scrollTo({top:0,behavior:'instant'});}
function updateList(){const el=document.getElementById('paperList');if(el)el.innerHTML=listHTML();document.getElementById('listCount').textContent=`${filtered().length} / 42 篇`;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));document.querySelectorAll('[data-progress]').forEach(el=>el.textContent=progress());document.getElementById('progressFill').style.width=read.size/42*100+'%';}
function setMenu(open){state.menu=open;document.getElementById('sidebar')?.classList.toggle('open',open);document.getElementById('backdrop').classList.toggle('open',open);document.body.style.overflow=open&&innerWidth<=800?'hidden':'';}
function go(id){id=Number(id);if(!byId.has(id))return;state.id=id;lastId=id;try{localStorage.setItem('iclr27_atlas_last',String(id))}catch(e){}history.replaceState(null,'','#paper-'+id);render();}
function homeGo(){state.id=null;history.replaceState(null,'',location.pathname+location.search);render();}
function toggleRead(){if(!state.id)return;read.has(state.id)?read.delete(state.id):read.add(state.id);save();updateList();document.querySelector('[data-read-button]').innerHTML=icon('check')+' '+(read.has(state.id)?'已读完 · 取消标记':'标记读完');toast(read.has(state.id)?'已记下阅读进度':'已取消已读标记');}
function toggleSave(){if(!state.id)return;saved.has(state.id)?saved.delete(state.id):saved.add(state.id);save();updateList();const el=document.querySelector('[data-save-button]');if(el)el.innerHTML=icon('star')+' '+(saved.has(state.id)?'已收藏':'收藏本篇');toast(saved.has(state.id)?'已加入收藏':'已取消收藏');}
const viewer=document.getElementById('viewer'),light=document.getElementById('lightImage'),stage=document.getElementById('lightStage');let zoom=1;
function zoomImage(){const base=Math.min(light.naturalWidth||1000,Math.max(240,stage.clientWidth-36));light.style.width=Math.round(base*zoom)+'px';}
function showImage(token){const [id,i]=token.split(':').map(Number),p=byId.get(id),f=p?.figures[i];if(!f)return;zoom=1;light.removeAttribute('src');light.style.width='100%';light.hidden=false;document.getElementById('viewerError').hidden=true;document.getElementById('viewerTitle').textContent=p.zh+' · '+f.title;document.getElementById('originalImage').href=f.src;light.alt=f.title;light.referrerPolicy='no-referrer';light.src=f.src;if(!viewer.open)viewer.showModal();document.body.style.overflow='hidden';stage.scrollTop=0;stage.scrollLeft=0;zoomImage();}
light.addEventListener('load',zoomImage);light.addEventListener('error',()=>{light.hidden=true;document.getElementById('viewerError').hidden=false});viewer.addEventListener('close',()=>{document.body.style.overflow=state.menu&&innerWidth<=800?'hidden':''});
function retryFigure(token){const el=document.querySelector(`[data-zoom="${token}"]`);if(!el)return;el.classList.remove('loaded','broken');const msg=el.querySelector('.imageStatus');msg.textContent='正在重新读取原图…';const img=el.querySelector('img'),src=img.getAttribute('src');img.removeAttribute('src');setTimeout(()=>img.src=src,30);}
document.addEventListener('load',e=>{if(e.target.tagName==='IMG'){e.target.closest('.figureOpen')?.classList.add('loaded')}},true);
document.addEventListener('error',e=>{if(e.target.tagName!=='IMG')return;const parent=e.target.closest('.figureOpen');if(parent){parent.classList.add('broken');parent.querySelector('.imageStatus').textContent='图片暂未加载，可点下方“打开原图”或“重新加载”。'}},true);
function exportProgress(){const blob=new Blob([JSON.stringify({version:3,read:[...read],saved:[...saved],notes},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='benchmark-atlas-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('进度备份已生成');}
async function copyLink(){try{await navigator.clipboard.writeText(location.href);toast('已复制阅读链接')}catch(e){toast('可通过浏览器分享按钮复制当前链接');}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-paper],[data-filter],[data-filter-open],[data-action],[data-zoom],[data-retry]');if(!button||button.disabled)return;if(button.dataset.paper!==undefined){go(button.dataset.paper);return}if(button.dataset.filter){state.filter=button.dataset.filter;updateList();return}if(button.dataset.filterOpen){state.filter=button.dataset.filterOpen;updateList();setMenu(true);document.getElementById('paperList').scrollTop=0;return}if(button.dataset.zoom){showImage(button.dataset.zoom);return}if(button.dataset.retry){retryFigure(button.dataset.retry);return}switch(button.dataset.action){case 'home':homeGo();break;case 'menu':setMenu(true);break;case 'close-menu':setMenu(false);break;case 'read':toggleRead();break;case 'save':toggleSave();break;case 'copy':copyLink();break;case 'export':exportProgress();break;case 'import':document.getElementById('importFile').click();break;case 'close-image':viewer.close();break;case 'zoom-in':zoom=Math.min(5,zoom*1.5);zoomImage();break;case 'zoom-out':zoom=Math.max(.5,zoom/1.5);zoomImage();break;case 'zoom-fit':zoom=1;zoomImage();break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.q=e.target.value;updateList()}if(e.target.id==='myNote'&&state.id){notes[state.id]=e.target.value;save()}});
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw new Error();const obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.read)||!Array.isArray(obj.saved))throw new Error();validIds(obj.read).forEach(i=>read.add(i));validIds(obj.saved).forEach(i=>saved.add(i));if(obj.notes&&typeof obj.notes==='object')for(const [id,text] of Object.entries(obj.notes))if(byId.has(Number(id))&&typeof text==='string')notes[id]=text;save();render();toast('备份已合并，原进度已保留')}catch(err){toast('无法读取此备份，请选择导出的 JSON 文件')}e.target.value='';});
function fromHash(){const m=location.hash.match(/^#paper-(\d+)$/);state.id=m&&byId.has(Number(m[1]))?Number(m[1]):null;if(state.id)lastId=state.id;}
window.addEventListener('hashchange',()=>{fromHash();render()});window.addEventListener('resize',()=>{if(viewer.open)zoomImage();if(innerWidth>800)document.body.style.overflow=''});
document.addEventListener('keydown',e=>{if(viewer.open||e.target.closest('input,textarea,select')||e.ctrlKey||e.metaKey)return;if(e.key==='Escape'){setMenu(false);return}if(state.menu||!state.id)return;if(e.key==='ArrowRight')go(state.id+1);if(e.key==='ArrowLeft')go(state.id-1)});
let touch=null;document.addEventListener('touchstart',e=>{touch=null;if(state.id&&!state.menu&&!viewer.open&&e.touches.length===1&&!e.target.closest('img,figure,textarea,input,button,a'))touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!touch||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>125&&Math.abs(dy)<60&&Math.abs(dx)>Math.abs(dy)*2)go(state.id+(dx<0?1:-1))},{passive:true});
fromHash();render();
});
</script>
</body>
</html>
